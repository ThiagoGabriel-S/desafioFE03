<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de jogos</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #ffffff;
            --text: #222;
            --muted: #666;
            --accent: #5b4bdb;
            --border: #e2e4e9;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 2rem 1rem;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
        }

        h2 {
            margin: 0 0 1rem;
            font-size: 1.6rem;
        }

        section {
            margin-bottom: 1rem;
            padding: 1rem 1.25rem 1.1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        h3 {
            margin: 0 0 0.75rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border);
            font-size: 1.1rem;
        }

        ul, ol {
            margin: 0;
            padding-left: 1.4rem;
        }

        li {
            margin: 0.35rem 0;
        }

        li::marker {
            color: var(--accent);
            font-weight: 600;
        }

        li > strong {
            font-weight: 600;
        }

        li ul {
            margin-top: 0.2rem;
            color: var(--muted);
            font-size: 0.95rem;
        }

        del {
            color: var(--muted);
        }

        ins {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .sep {
            margin: 0 0.35rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <h2>🎮 Loja de jogos</h2>

        <section>
            <h3>Jogos Triple-A</h3>
            <ul>
                <li>
                    <strong>Baldur's Gate 3</strong>
                    <ul>
                        <li>Versão base</li>
                        <li>Versão deluxe</li>
                    </ul>
                </li>
                <li>
                    <strong>Elden Ring</strong>
                    <ul>
                        <li>Versão base</li>
                        <li>Versão deluxe</li>
                    </ul>
                </li>
            </ul>
        </section>

        <section>
            <h3>Top 3 Mais Adquiridos</h3>
            <ol reversed>
                <li>
                    Undertale <span class="sep">&bull;</span>
                    De <del>R$49,00</del> por <ins>R$4,99</ins>
                </li>
                <li>
                    Hollow Knight <span class="sep">&bull;</span>
                    De <del>R$46,99</del> por <ins>R$23,49</ins>
                </li>
                <li>
                    Terraria <span class="sep">&bull;</span>
                    De <del>R$32,99</del> por <ins>R$16,99</ins>
                </li>
            </ol>
        </section>
    </main>
</body>
</html>
